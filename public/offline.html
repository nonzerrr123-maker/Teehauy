<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#06060C" />
    <title>Teehauy · Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06060c;color:#d4e0ee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}.card{width:min(420px,100%);padding:28px 22px;border:1px solid rgba(201,168,76,.28);border-radius:24px;background:linear-gradient(145deg,rgba(26,26,42,.94),rgba(13,13,24,.98));text-align:center;box-shadow:0 0 50px rgba(201,168,76,.08)}.orb{width:64px;height:64px;margin:0 auto 18px;display:grid;place-items:center;border-radius:999px;border:1px solid rgba(201,168,76,.4);font-size:30px;background:#13131f}h1{margin:0;color:#f0c040;font-size:22px}p{margin:10px 0 20px;color:#8d98aa;font-size:14px;line-height:1.65}button{border:1px solid rgba(201,168,76,.5);border-radius:14px;padding:11px 18px;background:rgba(201,168,76,.1);color:#e4c96d;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="orb">🔮</div>
      <h1>ตอนนี้ออฟไลน์อยู่</h1>
      <p>Teehauy ยังเปิดหน้าออนไลน์ไม่ได้ในขณะนี้ เมื่อมีอินเทอร์เน็ตแล้วกดลองใหม่ได้เลย</p>
      <button type="button" onclick="location.reload()">ลองใหม่</button>
    </main>
  </body>
</html>
