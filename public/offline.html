<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#9b6c17" />
    <title>Teehauy · Offline</title>
    <style>
      :root{color-scheme:light dark;--bg:#f8f7f3;--fg:#1b1b1d;--card:#fff;--muted:#6e6a63;--gold:#9b6c17;--border:#dedbd3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}.card{width:min(420px,100%);padding:28px 22px;border:1px solid var(--border);border-radius:24px;background:var(--card);text-align:center;box-shadow:0 24px 70px rgba(44,35,20,.12)}.orb{width:64px;height:64px;margin:0 auto 18px;display:grid;place-items:center;border-radius:999px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);font-size:30px;background:color-mix(in srgb,var(--gold) 8%,var(--card))}h1{margin:0;color:var(--gold);font-size:22px}p{margin:10px 0 20px;color:var(--muted);font-size:14px;line-height:1.65}button{border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);border-radius:14px;padding:11px 18px;background:color-mix(in srgb,var(--gold) 10%,var(--card));color:var(--gold);font-weight:700;cursor:pointer}@media(prefers-color-scheme:dark){:root{--bg:#090b10;--fg:#f5f1e8;--card:#11141c;--muted:#949ba9;--gold:#d8b568;--border:#272c37}.card{box-shadow:0 24px 70px rgba(0,0,0,.35)}}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="orb">🔮</div>
      <h1>ตอนนี้ออฟไลน์อยู่</h1>
      <p>Teehauy ยังเปิดหน้าออนไลน์ไม่ได้ในขณะนี้ เมื่อมีอินเทอร์เน็ตแล้วกดลองใหม่ได้เลย</p>
      <button type="button" onclick="location.reload()">ลองใหม่</button>
    </main>
  </body>
</html>
